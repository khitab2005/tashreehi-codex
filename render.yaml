services:
  - type: web
    name: tashreehi
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
